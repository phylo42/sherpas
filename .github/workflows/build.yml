name: CMake

on: [push]

env:
  # Customize the CMake build type here (Release, Debug, RelWithDebInfo, etc.)
  BUILD_TYPE: Release

jobs:
  build:

    name: ${{matrix.buildname}}

    runs-on: ${{matrix.os}}

    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-20.04, macos-11.0 ]
        include:
          - os: ubuntu-20.04
            buildname: 'ubuntu-20.04'
            triplet: x64-linux
            compiler: gcc_64
          #- os: ubuntu-18.04
          #  buildname: 'ubuntu-18.04'
          #  triplet: x64-linux
          #  compiler: gcc_64
          #- os: macos-10.15
          #  buildname: 'macos-10.15'
          #  triplet: x64-osx
          #  compiler: clang_64
          - os: macos-11.0
            buildname: 'macos-11.0'
            triplet: x64-osx
            compiler: clang_64
    steps:
    - name: Checkout
      uses: actions/checkout@v2
      with:
        submodules: recursive

    - name: (MacOS) Install dependencies
      if: runner.os == 'macOS'
      run: brew install boost

    - name: (Linux) Install dependencies
      if: runner.os == 'Linux'
      run: sudo apt-get update && sudo apt-get install -yq libboost-dev libboost-serialization-dev libboost-filesystem-dev libboost-iostreams-dev

    - name: Create Build Environment
      # Some projects don't allow in-source building, so create a separate build directory
      # We'll use this as our working directory for all subsequent commands
      run: cmake -E make_directory ${{runner.workspace}}/build

    - name: Configure CMake
      # Use a bash shell so we can use the same syntax for environment variable
      # access regardless of the host operating system
      shell: bash
      working-directory: ${{runner.workspace}}/build
      run: cmake -DCMAKE_POLICY_VERSION_MINIMUM=3.5 .  
      
    - name: Build
      working-directory: ${{runner.workspace}}/build
      shell: bash
      # Execute the build.  You can specify a specific target with "--target <NAME>"
      run: make

    - name: Test SHERPAS
      working-directory: ${{runner.workspace}}/build
      shell: bash
      run: sherpas/SHERPAS -h

    - name: Test XPAS-DNA (db build capacity)
      working-directory: ${{runner.workspace}}/build
      shell: bash
      run: lib/xpas/build/xpas-build-dna -h
      
